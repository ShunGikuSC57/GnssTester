<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        html, body, #map {
            height: 100%;
            margin: 0;
        }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        const map = L.map('map').setView([35.681236, 139.767125], 15);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        let mobile = null;

        // 地図ドラッグ時：C#側へ地図操作を通知する
        map.on('dragstart', () => {
            window.chrome.webview.postMessage({ type: 'userMoved' });
        });

        // C#側から呼ばれる：移動体扱いのマーカーを描画し直し動きを表現する
        const moveMobile = (lat, lng) => {
            removeMobile();
            mobile = L.marker([lat, lng]).addTo(map);
        }

        // C#側からも呼ばれる：移動体扱いのマーカーを削除する
        const removeMobile = () => {
            if (mobile) map.removeLayer(mobile);
        }

        // C#側から呼ばれる：指定した座標を地図の中心にする
        const centerMap = (lat, lng) => {
            map.panTo([lat, lng]);
        }
    </script>
</body>
</html>
